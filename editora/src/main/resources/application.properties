### Server configuration ###
server.servlet.context-path=/editora
server.port=8000
# mostra a mensagem dos erros (404, 409...) no JSON de resposta
server.error.include-message=always

### Database configuration ###
spring.datasource.url=jdbc:postgresql://localhost:5432/editora
spring.datasource.username=postgres
# troque SUA_SENHA pela senha do seu PostgreSQL (a mesma do pgAdmin)
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}
spring.jpa.hibernate.ddl-auto=update
# mostra no console os comandos SQL (inclusive a criacao da chave estrangeira)
spring.jpa.show-sql=true
